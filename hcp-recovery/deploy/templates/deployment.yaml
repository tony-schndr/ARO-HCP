apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcp-recovery
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hcp-recovery
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hcp-recovery
  replicas: {{ .Values.deployment.replicas }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hcp-recovery
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
      containers:
      - name: hcp-recovery-controller
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}@{{ .Values.image.digest }}"
        args:
        - "--health-address=:{{ .Values.health.port }}"
        - "--log-verbosity={{ .Values.logVerbosity }}"
        - "--worker-image={{ .Values.workerImage }}"
        - "--worker-service-account={{ .Values.workerServiceAccount.name }}"
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: health
          containerPort: {{ .Values.health.port }}
          protocol: TCP
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: {{ .Values.deployment.requests.cpu }}
            memory: {{ .Values.deployment.requests.memory }}
          limits:
            memory: {{ .Values.deployment.limits.memory }}
      priorityClassName: service-lifecycle-critical
      terminationGracePeriodSeconds: 10
