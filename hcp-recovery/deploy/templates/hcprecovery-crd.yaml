apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hcprecoveries.hcprecovery.aro-hcp.azure.com
spec:
  group: hcprecovery.aro-hcp.azure.com
  names:
    kind: HCPRecovery
    listKind: HCPRecoveryList
    plural: hcprecoveries
    singular: hcprecovery
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: ClusterID
      type: string
      jsonPath: .spec.hcpClusterAzureResourceId
    - name: BackupID
      type: string
      jsonPath: .spec.veleroBackupName
    - name: Phase
      type: string
      jsonPath: .status.phase
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-validations:
        - rule: "(!has(oldSelf.status) || !has(oldSelf.status.phase)) ? (!has(self.status) || !has(self.status.phase) || self.status.phase in ['Preparing', 'Failed']) : (has(self.status) && has(self.status.phase) && (self.status.phase == 'Failed' || self.status.phase == oldSelf.status.phase || (oldSelf.status.phase == 'Preparing' && self.status.phase == 'Restoring') || (oldSelf.status.phase == 'Restoring' && self.status.phase == 'Validating') || (oldSelf.status.phase == 'Validating' && self.status.phase == 'Completed')))"
          message: phase must advance Preparing -> Restoring -> Validating -> Completed, or to Failed from any phase
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            x-kubernetes-validations:
            - rule: self == oldSelf
              message: spec is immutable
            required:
            - hcpClusterAzureResourceId
            - hostedClusterName
            - hostedClusterNamespace
            - controlPlaneNamespace
            - veleroBackupName
            properties:
              hcpClusterAzureResourceId:
                type: string
              hostedClusterName:
                type: string
                minLength: 1
              hostedClusterNamespace:
                type: string
              controlPlaneNamespace:
                type: string
              veleroBackupName:
                type: string
          status:
            type: object
            properties:
              phase:
                type: string
                enum:
                - Preparing
                - Restoring
                - Validating
                - Completed
                - Failed
              startedAt:
                type: string
                format: date-time
              completedAt:
                type: string
                format: date-time
              restoredToTimestamp:
                type: string
                format: date-time
              restoreName:
                type: string
              etcdRuntimeDetails:
                type: object
                required:
                - image
                properties:
                  image:
                    type: string
                  runAsUser:
                    type: integer
                    format: int64
                    minimum: 0
                  fsGroup:
                    type: integer
                    format: int64
                    minimum: 0
              etcdSnapshot:
                type: object
                required:
                - sourceMember
                - sha256
                - revision
                properties:
                  sourceMember:
                    type: string
                    minLength: 1
                  sha256:
                    type: string
                    minLength: 64
                    maxLength: 64
                    pattern: "^[0-9a-f]{64}$"
                  revision:
                    type: integer
                    format: int64
                    minimum: 0
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                    reason:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    lastTransitionTime:
                      type: string
                      format: date-time
