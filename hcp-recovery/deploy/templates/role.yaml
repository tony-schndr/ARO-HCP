apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hcp-recovery-controller
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - hcprecovery.aro-hcp.azure.com
  resources:
  - hcprecoveries
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hcprecovery.aro-hcp.azure.com
  resources:
  - hcprecoveries/status
  verbs:
  - get
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
