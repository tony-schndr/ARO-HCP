# Source: hcp-recovery/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcp-recovery
  namespace: hcp-recovery
  labels:
    app.kubernetes.io/name: hcp-recovery
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hcp-recovery
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hcp-recovery
    spec:
      serviceAccountName: hcp-recovery
      securityContext:
        runAsNonRoot: true
      containers:
      - name: hcp-recovery-controller
        image: "arohcpsvcdev.azurecr.io/arohcprecovery@sha256:1234567890"
        args:
        - "--health-address=:8080"
        - "--log-verbosity=2"
        - "--worker-image=mcr.microsoft.com/aks/command/runtime@sha256:1234567890"
        - "--worker-service-account=hcp-recovery-worker"
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: health
          containerPort: 8080
          protocol: TCP
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
      priorityClassName: service-lifecycle-critical
      terminationGracePeriodSeconds: 10

