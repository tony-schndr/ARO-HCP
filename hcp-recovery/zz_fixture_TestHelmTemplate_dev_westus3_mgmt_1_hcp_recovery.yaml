---
# Source: hcp-recovery/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hcp-recovery
  namespace: hcp-recovery
---
# Source: hcp-recovery/templates/worker-rbac.yaml
# Identity for the short-lived pods that carry out recovery work inside the
# control-plane namespace: copying the etcd snapshot between holder pods and
# interrogating etcd once it is back up.
#
# This is separate from the controller's own ServiceAccount on purpose. Driving those
# pods needs pods/exec, which is effectively root inside any pod it can reach, so the
# grant is kept off the controller and narrowed to the specific pod names involved.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hcp-recovery-worker
  namespace: hcp-recovery
---
