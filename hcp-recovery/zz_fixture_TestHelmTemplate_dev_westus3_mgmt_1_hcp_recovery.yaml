# Source: hcp-recovery/templates/worker-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hcp-recovery-worker
rules:
# kubectl wait/exec resolve the target pod before streaming to it.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  resourceNames:
  # The holder pods that mount the etcd volumes during snapshot distribution, and the
  # etcd member that answers the post-restore health check.
  - etcd-holder-0
  - etcd-holder-1
  - etcd-holder-2
  - etcd-0
  verbs:
  - create
